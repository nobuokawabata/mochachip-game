<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>モカチップなでなでゲーム 💕</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --pink: #ff8fab;
    --pink-deep: #ff5c8a;
    --cream: #fff4f0;
    --purple: #c084fc;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{
    margin:0; padding:0; width:100%; height:100%; overflow:hidden;
    font-family:'M PLUS Rounded 1c', sans-serif;
    background: linear-gradient(160deg,#ffd6e8 0%, #ffe9d6 45%, #fff0f5 100%);
    touch-action: manipulation;
  }
  #app{
    position:relative; width:100vw; height:100vh;
    display:flex; flex-direction:column; align-items:center; justify-content:flex-start;
    overflow:hidden;
  }
  /* floating background decoration */
  .bgpaw{
    position:absolute; opacity:0.18; font-size:40px; pointer-events:none; user-select:none;
    animation: floaty 6s ease-in-out infinite;
  }
  @keyframes floaty{
    0%,100%{ transform: translateY(0) rotate(0deg); }
    50%{ transform: translateY(-18px) rotate(10deg); }
  }

  h1{
    margin: 14px 0 2px 0;
    font-size: 26px;
    font-weight: 800;
    color: var(--pink-deep);
    text-shadow: 1px 2px 0 #fff;
    text-align:center;
    letter-spacing: 1px;
    z-index: 5;
  }
  .subtitle{
    color:#b4587a; font-weight:700; font-size:13px; margin-bottom:6px; z-index:5;
  }

  /* ---------- START SCREEN ---------- */
  #startScreen{
    position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    z-index: 20; text-align:center; padding: 20px;
  }
  .start-photo{
    width: 220px; height: 220px; border-radius: 50%;
    object-fit: cover; border: 8px solid #fff;
    box-shadow: 0 10px 30px rgba(255,92,138,0.35);
    animation: bob 3s ease-in-out infinite;
    margin-bottom: 18px;
  }
  @keyframes bob{
    0%,100%{ transform: translateY(0) rotate(-2deg); }
    50%{ transform: translateY(-14px) rotate(2deg); }
  }
  .bigtitle{
    font-size: 30px; font-weight:800; color: var(--pink-deep);
    text-shadow: 2px 2px 0 #fff;
    margin-bottom: 6px;
  }
  .desc{
    color:#9a5570; font-size:14px; font-weight:700; line-height:1.7; max-width:320px; margin-bottom:22px;
  }
  .bestbox{
    background:#fff; border-radius:16px; padding:10px 18px; font-size:13px; font-weight:700;
    color:#b4587a; box-shadow: 0 4px 14px rgba(255,140,170,0.3); margin-bottom:22px;
  }
  button{
    font-family:'M PLUS Rounded 1c', sans-serif;
    border:none; cursor:pointer;
  }
  .playbtn{
    background: linear-gradient(135deg, #ff8fab, #ff5c8a);
    color:#fff; font-weight:800; font-size:20px;
    padding: 16px 48px; border-radius: 50px;
    box-shadow: 0 8px 0 #d94370, 0 10px 20px rgba(217,67,112,0.4);
    transition: transform 0.08s;
  }
  .playbtn:active{ transform: translateY(6px); box-shadow: 0 2px 0 #d94370; }

  /* ---------- GAME SCREEN ---------- */
  #gameScreen{
    display:none; width:100%; height:100%; flex-direction:column; align-items:center;
    position:relative; z-index: 10;
  }
  .hud{
    width: 100%; max-width: 420px; padding: 6px 18px; z-index: 15;
  }
  .meterLabel{
    display:flex; justify-content:space-between; font-size:12px; font-weight:700; color:#b4587a; margin-bottom:4px;
  }
  .meterWrap{
    width:100%; height: 22px; background:#fff; border-radius: 20px; overflow:hidden;
    box-shadow: inset 0 2px 6px rgba(0,0,0,0.1), 0 2px 6px rgba(255,140,170,0.3);
    border: 2px solid #fff;
    position:relative;
  }
  .meterFill{
    height:100%; width:0%;
    background: linear-gradient(90deg, #ffb3c6, #ff5c8a, #ff8fab);
    background-size: 200% 100%;
    border-radius: 20px;
    transition: width 0.12s ease-out;
    position:relative;
  }
  .meterFill::after{
    content:'';
    position:absolute; inset:0;
    background: repeating-linear-gradient(135deg, rgba(255,255,255,0.3) 0 10px, transparent 10px 20px);
  }
  .timerRow{
    display:flex; justify-content:space-between; align-items:center; margin-top:6px;
    font-size:13px; font-weight:800; color:#9a5570;
  }

  .stage{
    position:relative; flex:1; width:100%; max-width: 420px;
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
  }
  .dogWrap{
    position:relative; width: 78vw; max-width: 300px; aspect-ratio: 1/1;
    border-radius: 50%;
    user-select:none; -webkit-user-select:none;
    cursor: pointer;
  }
  .dogPhoto{
    position:absolute; inset:0; width:100%; height:100%;
    object-fit: cover; border-radius: 50%;
    border: 10px solid #fff;
    box-shadow: 0 14px 36px rgba(255,92,138,0.45);
    opacity: 0; transition: opacity 0.5s ease;
  }
  .dogPhoto.active{ opacity: 1; }
  .dogWrap.pet{
    animation: petwiggle 0.22s ease;
  }
  @keyframes petwiggle{
    0%{ transform: scale(1) rotate(0deg); }
    30%{ transform: scale(1.07) rotate(-4deg); }
    60%{ transform: scale(0.97) rotate(3deg); }
    100%{ transform: scale(1) rotate(0deg); }
  }
  .ring{
    position:absolute; inset:-10px; border-radius:50%;
    border: 3px dashed rgba(255,92,138,0.5);
    animation: spin 18s linear infinite;
    pointer-events:none;
  }
  @keyframes spin{ from{transform:rotate(0deg);} to{transform:rotate(360deg);} }

  .bubble{
    position:absolute; top:-6px; left:50%; transform: translate(-50%,-100%) scale(0.6);
    background:#fff; color:#ff5c8a; font-weight:800; font-size:16px;
    padding:8px 16px; border-radius: 18px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.15);
    opacity:0; pointer-events:none; white-space:nowrap;
    z-index: 30;
  }
  .bubble::after{
    content:''; position:absolute; bottom:-8px; left:50%; transform:translateX(-50%);
    border-width:8px 7px 0 7px; border-style:solid; border-color:#fff transparent transparent transparent;
  }
  .bubble.show{
    animation: bubblepop 0.9s ease forwards;
  }
  @keyframes bubblepop{
    0%{ opacity:0; transform: translate(-50%,-80%) scale(0.5); }
    15%{ opacity:1; transform: translate(-50%,-110%) scale(1.1); }
    25%{ transform: translate(-50%,-110%) scale(1); }
    80%{ opacity:1; }
    100%{ opacity:0; transform: translate(-50%,-140%) scale(0.9); }
  }

  .hint{
    margin-top: 10px; font-size:13px; font-weight:700; color:#b4587a; opacity:0.8; z-index:5;
  }

  .heart-particle{
    position:absolute; pointer-events:none; font-size: 22px;
    animation: heartfloat 1s ease-out forwards;
    z-index: 25;
  }
  @keyframes heartfloat{
    0%{ opacity:1; transform: translate(0,0) scale(0.6) rotate(0deg); }
    100%{ opacity:0; transform: translate(var(--dx), -140px) scale(1.3) rotate(var(--rot)); }
  }

  /* ---------- CELEBRATION ---------- */
  #celebrateScreen{
    position:absolute; inset:0; display:none; flex-direction:column; align-items:center; justify-content:center;
    z-index: 50; text-align:center; padding:20px;
    background: radial-gradient(circle at 50% 30%, rgba(255,255,255,0.9), rgba(255,214,232,0.95));
  }
  .celeb-title{
    font-size: 28px; font-weight: 800; color: var(--pink-deep);
    text-shadow: 2px 2px 0 #fff;
    margin-bottom: 10px;
    animation: pulseText 0.6s ease infinite alternate;
  }
  @keyframes pulseText{ from{ transform: scale(1);} to{ transform: scale(1.06);} }
  .celeb-photos{
    display:flex; gap:10px; margin: 14px 0 18px 0;
  }
  .celeb-photos img{
    width: 90px; height: 90px; object-fit:cover; border-radius: 16px;
    border: 4px solid #fff; box-shadow: 0 6px 16px rgba(255,92,138,0.4);
    transform: rotate(var(--r));
  }
  .celeb-stats{
    background:#fff; border-radius: 18px; padding: 14px 24px; margin-bottom: 20px;
    box-shadow: 0 6px 20px rgba(255,140,170,0.35);
  }
  .celeb-stats .time{ font-size:26px; font-weight:800; color:#ff5c8a; }
  .celeb-stats .best{ font-size:13px; font-weight:700; color:#b4587a; margin-top:4px;}
  .newrecord{
    color:#ff9900; font-weight:800; font-size:14px; margin-top:6px;
    animation: pulseText 0.5s ease infinite alternate;
  }
  .retrybtn{
    background: linear-gradient(135deg, #ff8fab, #ff5c8a);
    color:#fff; font-weight:800; font-size:17px;
    padding: 13px 38px; border-radius: 50px;
    box-shadow: 0 7px 0 #d94370;
  }
  .retrybtn:active{ transform: translateY(5px); box-shadow: 0 2px 0 #d94370; }

  .fallheart{
    position:fixed; top:-40px; pointer-events:none; z-index: 45;
    animation: fallDown linear forwards;
  }
  @keyframes fallDown{
    to{ transform: translateY(110vh) rotate(360deg); }
  }

  .flash{
    position:absolute; inset:0; background:#fff; opacity:0; pointer-events:none; z-index:60;
  }
  .flash.go{ animation: flashfade 0.5s ease; }
  @keyframes flashfade{ 0%{opacity:0.9;} 100%{opacity:0;} }
</style>
</head>
<body>
<div id="app">
  <div class="flash" id="flash"></div>

  <!-- START SCREEN -->
  <div id="startScreen">
    <img class="start-photo" src="images/mochachip-1.jpg" alt="モカチップ">
    <div class="bigtitle">モカチップ<br>なでなでゲーム 🐾💕</div>
    <div class="desc">
      モカチップをタップ／クリックして<br>
      ハートゲージを <b>100%</b> まで満タンにしよう！<br>
      気を抜くとゲージはどんどん減っちゃうよ〜
    </div>
    <div class="bestbox" id="bestBox">ベストタイム：まだ記録なし</div>
    <button class="playbtn" id="startBtn">なでる ♡ スタート</button>
  </div>

  <!-- GAME SCREEN -->
  <div id="gameScreen">
    <h1>モカチップ なでなでゲーム</h1>
    <div class="subtitle">タップ連打で愛情ゲージを満タンに！</div>
    <div class="hud">
      <div class="meterLabel"><span>モカチップの気持ち ❤</span><span id="meterPct">0%</span></div>
      <div class="meterWrap"><div class="meterFill" id="meterFill"></div></div>
      <div class="timerRow">
        <span id="timerText">⏱ 0.0 秒</span>
        <span id="comboText"></span>
      </div>
    </div>
    <div class="stage">
      <div class="dogWrap" id="dogWrap">
        <div class="ring"></div>
        <img class="dogPhoto active" id="photo0" src="images/mochachip-1.jpg">
        <img class="dogPhoto" id="photo1" src="images/mochachip-2.jpg">
        <img class="dogPhoto" id="photo2" src="images/mochachip-3.jpg">
        <div class="bubble" id="bubble"></div>
      </div>
    </div>
    <div class="hint">👆 モカチップをいっぱいなでてね</div>
  </div>

  <!-- CELEBRATION -->
  <div id="celebrateScreen">
    <div class="celeb-title">だいすき だいすき だいすき！💖</div>
    <div class="celeb-photos" id="celebPhotos"></div>
    <div class="celeb-stats">
      <div class="time" id="finalTime">0.0 秒</div>
      <div class="best" id="finalBest">ベストタイム：--</div>
      <div class="newrecord" id="newRecord" style="display:none;">🎉 ベスト記録更新！ 🎉</div>
    </div>
    <button class="retrybtn" id="retryBtn">もう一回なでる ♡</button>
  </div>
</div>

<script>
(function(){
  const startScreen = document.getElementById('startScreen');
  const gameScreen = document.getElementById('gameScreen');
  const celebrateScreen = document.getElementById('celebrateScreen');
  const startBtn = document.getElementById('startBtn');
  const retryBtn = document.getElementById('retryBtn');
  const dogWrap = document.getElementById('dogWrap');
  const meterFill = document.getElementById('meterFill');
  const meterPct = document.getElementById('meterPct');
  const timerText = document.getElementById('timerText');
  const comboText = document.getElementById('comboText');
  const bubble = document.getElementById('bubble');
  const bestBox = document.getElementById('bestBox');
  const finalTime = document.getElementById('finalTime');
  const finalBest = document.getElementById('finalBest');
  const newRecord = document.getElementById('newRecord');
  const celebPhotos = document.getElementById('celebPhotos');
  const flash = document.getElementById('flash');
  const photos = [document.getElementById('photo0'), document.getElementById('photo1'), document.getElementById('photo2')];
  const photoSrcs = [photos[0].src, photos[1].src, photos[2].src];

  const BEST_KEY = 'mochachip_best_time';
  // localStorage can throw (sandboxed preview, privacy mode, etc).
  // Fall back to an in-memory store so a storage error never stops the
  // rest of this script from running (which would otherwise leave the
  // start button with no click handler attached).
  const memoryStore = {};
  const safeStorage = {
    getItem(key){
      try{ return localStorage.getItem(key); }
      catch(e){ return Object.prototype.hasOwnProperty.call(memoryStore, key) ? memoryStore[key] : null; }
    },
    setItem(key, value){
      try{ localStorage.setItem(key, value); }
      catch(e){ memoryStore[key] = value; }
    }
  };

  let affection = 0;
  let running = false;
  let startTime = 0;
  let rafId = null;
  let lastDecayTime = 0;
  let clickCount = 0;
  let comboTimer = null;
  let currentPhotoIdx = 0;

  // Wire up the buttons FIRST, before any other setup runs below.
  // If something later (storage access, etc.) ever throws, the
  // start/retry buttons will still work.
  dogWrap.addEventListener('click', function(e){ pet(e); });
  dogWrap.addEventListener('touchstart', function(e){ e.preventDefault(); pet(e); }, {passive:false});
  startBtn.addEventListener('click', function(){ startGame(); });
  retryBtn.addEventListener('click', function(){ startGame(); });

  const messages =['きゃん！💕','うれしい！','もっとなでて〜','しっぽフリフリ！','だいすき！','ふわふわ〜','ワン！ワン！','きもちいい〜','なでなで最高！','もふもふ〜'];

  function loadBest(){
    const v = safeStorage.getItem(BEST_KEY);
    if(v){
      bestBox.textContent = 'ベストタイム：' + parseFloat(v).toFixed(1) + ' 秒';
      return parseFloat(v);
    }
    bestBox.textContent = 'ベストタイム：まだ記録なし';
    return null;
  }
  loadBest();

  function setPhoto(idx){
    if(idx === currentPhotoIdx) return;
    currentPhotoIdx = idx;
    photos.forEach((p,i)=> p.classList.toggle('active', i===idx));
  }

  function spawnHearts(x, y, count){
    const hearts = ['💖','💕','💗','❤️','💓','✨'];
    for(let i=0;i<count;i++){
      const h = document.createElement('div');
      h.className = 'heart-particle';
      h.textContent = hearts[Math.floor(Math.random()*hearts.length)];
      h.style.left = x + 'px';
      h.style.top = y + 'px';
      const dx = (Math.random()-0.5) * 140;
      const rot = (Math.random()-0.5) * 180;
      h.style.setProperty('--dx', dx+'px');
      h.style.setProperty('--rot', rot+'deg');
      h.style.animationDuration = (0.8 + Math.random()*0.6) + 's';
      dogWrap.appendChild(h);
      setTimeout(()=> h.remove(), 1500);
    }
  }

  function showBubble(text){
    bubble.textContent = text;
    bubble.classList.remove('show');
    void bubble.offsetWidth; // reflow to restart animation
    bubble.classList.add('show');
  }

  function updateMeter(){
    const pct = Math.max(0, Math.min(100, affection));
    meterFill.style.width = pct + '%';
    meterPct.textContent = Math.floor(pct) + '%';
    if(pct < 33){ setPhoto(0); }
    else if(pct < 66){ setPhoto(1); }
    else { setPhoto(2); }
  }

  function tick(ts){
    if(!running) return;
    const elapsed = (ts - startTime) / 1000;
    timerText.textContent = '⏱ ' + elapsed.toFixed(1) + ' 秒';

    if(!lastDecayTime) lastDecayTime = ts;
    const dt = ts - lastDecayTime;
    if(dt > 0){
      // Gentle, constant decay. Earlier this ramped from 6%/s up to 12%/s,
      // which required sustained tapping faster than ~2 taps/sec just to
      // break even -- effectively unwinnable at a normal pace. A flat,
      // low decay means any steady petting makes real progress.
      const decayRate = 2.5; // %/sec
      affection -= decayRate * (dt/1000);
      if(affection < 0) affection = 0;
      lastDecayTime = ts;
      updateMeter();
    }

    if(affection >= 100){
      finishGame(elapsed);
      return;
    }
    rafId = requestAnimationFrame(tick);
  }

  function pet(e){
    if(!running) return;
    clickCount++;
    affection += 7 + Math.random()*4; // 7-11% per pet, avg 9%
    if(affection > 100) affection = 100;
    updateMeter();

    dogWrap.classList.remove('pet');
    void dogWrap.offsetWidth;
    dogWrap.classList.add('pet');

    const rect = dogWrap.getBoundingClientRect();
    let x, y;
    if(e.touches && e.touches[0]){
      x = e.touches[0].clientX - rect.left;
      y = e.touches[0].clientY - rect.top;
    } else {
      x = (e.clientX || rect.width/2) - rect.left;
      y = (e.clientY || rect.height/2) - rect.top;
    }
    spawnHearts(x, y, 3 + Math.floor(Math.random()*3));

    if(Math.random() < 0.35){
      showBubble(messages[Math.floor(Math.random()*messages.length)]);
    }

    comboText.textContent = 'なでなで ' + clickCount + '回';
  }

  function startGame(){
    startScreen.style.display = 'none';
    celebrateScreen.style.display = 'none';
    gameScreen.style.display = 'flex';
    affection = 0;
    clickCount = 0;
    currentPhotoIdx = -1;
    setPhoto(0);
    updateMeter();
    comboText.textContent = '';
    running = true;
    startTime = null;
    lastDecayTime = 0;
    rafId = requestAnimationFrame((ts)=>{
      startTime = ts;
      lastDecayTime = ts;
      rafId = requestAnimationFrame(tick);
    });
  }

  function finishGame(elapsedTime){
    running = false;
    if(rafId) cancelAnimationFrame(rafId);
    flash.classList.remove('go'); void flash.offsetWidth; flash.classList.add('go');

    gameScreen.style.display = 'none';
    celebrateScreen.style.display = 'flex';
    finalTime.textContent = elapsedTime.toFixed(1) + ' 秒';

    const prevBest = loadBest();
    let isNew = false;
    if(prevBest === null || elapsedTime < prevBest){
      safeStorage.setItem(BEST_KEY, elapsedTime.toFixed(2));
      isNew = true;
    }
    const best = loadBest();
    finalBest.textContent = 'ベストタイム：' + (best !== null ? best.toFixed(1)+' 秒' : '--');
    newRecord.style.display = isNew ? 'block' : 'none';

    celebPhotos.innerHTML = '';
    const rots = [-8, 4, -3];
    photoSrcs.forEach((src, i)=>{
      const img = document.createElement('img');
      img.src = src;
      img.style.setProperty('--r', rots[i]+'deg');
      celebPhotos.appendChild(img);
    });

    rainHearts(36);
  }

  function rainHearts(count){
    const hearts = ['💖','💕','💗','❤️','💓','🐾','✨'];
    for(let i=0;i<count;i++){
      setTimeout(()=>{
        const h = document.createElement('div');
        h.className = 'fallheart';
        h.textContent = hearts[Math.floor(Math.random()*hearts.length)];
        h.style.left = (Math.random()*100) + 'vw';
        h.style.fontSize = (16 + Math.random()*22) + 'px';
        h.style.animationDuration = (2.2 + Math.random()*2) + 's';
        document.getElementById('app').appendChild(h);
        setTimeout(()=> h.remove(), 4500);
      }, i * 80);
    }
  }

  // background decoration paws
  function scatterPaws(){
    const emojis = ['🐾','💕','🦴','✨'];
    for(let i=0;i<8;i++){
      const p = document.createElement('div');
      p.className = 'bgpaw';
      p.textContent = emojis[i % emojis.length];
      p.style.left = (Math.random()*90)+'vw';
      p.style.top = (Math.random()*90)+'vh';
      p.style.animationDelay = (Math.random()*4)+'s';
      p.style.animationDuration = (4 + Math.random()*4)+'s';
      document.getElementById('app').appendChild(p);
    }
  }
  scatterPaws();
})();
</script>
</body>
</html>
